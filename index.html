<script>
(()=>{
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

async function loadPublic(){
 try{S.settings=await DB.settings()}catch(e){console.warn(e)}
 try{S.products=await DB.products()}catch(e){console.error(e);toast('Could not load products: '+e.message,1)}
}
async function loadAll(){
 const r=await Promise.allSettled([DB.products(),DB.invoices(),DB.customers(),DB.orders(),DB.settings()]);
 if(r[0].status==='fulfilled')S.products=r[0].value;
 if(r[1].status==='fulfilled')S.invoices=r[1].value;
 if(r[2].status==='fulfilled')S.customers=r[2].value;
 if(r[3].status==='fulfilled')S.orders=r[3].value;
 if(r[4].status==='fulfilled')S.settings=r[4].value;
 r.filter(x=>x.status==='rejected').forEach(x=>console.error(x.reason));
 if(r.some(x=>x.status==='rejected'))toast('Some data failed to load – check database setup (see HOSTING_GUIDE.md)',1);
}

/* ================= image resize ================= */
function resizeImage(file,max,type){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('resize failed')),type,.85)};img.onerror=()=>rej(new Error('Not an image'));img.src=u})}
const blobToDataUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

/* ================= PDF ================= */
async function ensureFonts(){try{await Promise.all([document.fonts.load('600 14px "Noto Sans Telugu"','తెలుగు'),document.fonts.load('600 14px Poppins','Aa'),document.fonts.load('700 20px "Playfair Display"','Aa')]);await document.fonts.ready}catch{}}
const waitImgs=n=>Promise.all([...n.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;setTimeout(r,5000)})));
async function pagesToPdf(nodes){
 await ensureFonts();
 const{jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});let first=true;
 const holder=document.createElement('div');holder.className='pdf-holder';document.body.appendChild(holder);
 try{
  for(const node of nodes){
   holder.appendChild(node);await waitImgs(node);
   const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
   const pw=210,ph_=297,ratio=pw/canvas.width,pagePx=Math.floor(ph_/ratio);
   for(let y=0;y<canvas.height;y+=pagePx){
    const h=Math.min(pagePx,canvas.height-y);
    const c=document.createElement('canvas');c.width=canvas.width;c.height=h;c.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
    if(!first)pdf.addPage();first=false;
    pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,h*ratio);
   }
   holder.removeChild(node);
  }
 }finally{holder.remove()}
 return pdf.output('blob');
}

async function nextInvoiceNo(){
 const base='KPR-'+dkey(new Date()).replace(/-/g,'')+'-';
 const used=S.invoices.map(i=>i.invoice_no).filter(n=>n&&n.startsWith(base)).map(n=>parseInt(n.slice(base.length),10)||0);
 return base+String(Math.max(0,...used)+1).padStart(3,'0');
}

  const saved=await DB.saveInvoice(inv);saved.pay_label=bill.pay||'';

/* ---- reports ---- */
function repRange(){
 const now=new Date();let from,to=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59,999);
 if(repState.mode==='day')from=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 else if(repState.mode==='week'){from=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6)}
 else if(repState.mode==='month')from=new Date(now.getFullYear(),now.getMonth(),1);
 else{from=repState.from?new Date(repState.from+'T00:00:00'):new Date(2000,0,1);if(repState.to)to=new Date(repState.to+'T23:59:59')}
 return[from,to];
}
function repData(){
 const[from,to]=repRange();const inv=S.invoices.filter(i=>{const d=new Date(i.created_at);return d>=from&&d<=to});
 const pw={},cw={};
 inv.forEach(i=>{(i.items||[]).forEach(it=>{const k=it.name_en+' ('+gLabel(it.g)+')';const m=pw[k]||(pw[k]={qty:0,amt:0});m.qty+=it.qty;m.amt+=it.qty*it.price});
  const c=cw[i.customer_phone]||(cw[i.customer_phone]={name:i.customer_name,n:0,amt:0});c.n++;c.amt+=num(i.total)});
 return{inv,from,to,total:inv.reduce((a,i)=>a+num(i.total),0),pw:Object.entries(pw).sort((a,b)=>b[1].amt-a[1].amt),cw:Object.entries(cw).sort((a,b)=>b[1].amt-a[1].amt)};
}
function repHTML(r){
 return`<div class="stats"><div class="stat o"><small>${t('r_bills')}</small><b>${r.inv.length}</b></div><div class="stat g"><small>${t('r_sales')}</small><b>${inr(r.total)}</b></div></div>
 <div class="panel"><h3>${t('r_pw')}</h3><div class="tw"><table class="tb"><thead><tr><th>${t('item')}</th><th class="r">${t('qty')}</th><th class="r">${t('amount')}</th></tr></thead><tbody>${r.pw.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.qty}</td><td class="r">${inr(v.amt)}</td></tr>`).join('')||'<tr><td colspan=3>–</td></tr>'}</tbody></table></div></div>
 <div class="panel"><h3>⭐ ${t('r_best')}</h3>${r.pw.slice(0,3).map(([k,v],i)=>`<div>${i+1}. <b>${esc(k)}</b> – ${v.qty} pcs • ${inr(v.amt)}</div>`).join('')||'–'}</div>
 <div class="panel"><h3>${t('r_cw')}</h3><div class="tw"><table class="tb"><thead><tr><th>${t('c_name')}</th><th class="c">${t('bills_n')}</th><th class="r">${t('amount')}</th></tr></thead><tbody>${r.cw.map(([p,v])=>`<tr><td>${esc(v.name)} (${esc(p)})</td><td class="c">${v.n}</td><td class="r">${inr(v.amt)}</td></tr>`).join('')||'<tr><td colspan=3>–</td></tr>'}</tbody></table></div></div>`;
}
function tabRep(){
 $('#apage').innerHTML=`<div class="panel"><h3>📊 ${t('rep_title')}</h3><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
 <div class="field" style="margin:0"><select id="rm">${[['day','r_day'],['week','r_week'],['month','r_month'],['custom','r_custom']].map(([k,l])=>`<option value="${k}" ${repState.mode===k?'selected':''}>${t(l)}</option>`).join('')}</select></div>
 <div class="field" style="margin:0;${repState.mode==='custom'?'':'display:none'}" id="rc"><div style="display:flex;gap:6px"><input type="date" id="rf" value="${repState.from}"><input type="date" id="rt" value="${repState.to}"></div></div>
 <button class="btn sm" data-act="repCsv">⬇ ${t('dl_csv')}</button><button class="btn sm gold" data-act="repPdf">⬇ ${t('dl_pdf')}</button></div></div><div id="rbody"></div>`;
 const draw=()=>$('#rbody').innerHTML=repHTML(repData());draw();
 $('#rm').onchange=e=>{repState.mode=e.target.value;$('#rc').style.display=repState.mode==='custom'?'':'none';draw()};
 $('#rf').onchange=e=>{repState.from=e.target.value;draw()};$('#rt').onchange=e=>{repState.to=e.target.value;draw()};
}
function csvEsc(v){v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function repCsv(){
 const r=repData();const rows=[['Sales report',fd(r.from)+' to '+fd(r.to)],['Total bills',r.inv.length],['Total sales',r.total],[],['Invoice','Date','Customer','Phone','Subtotal','Discount','Delivery','GST','Total','Status']];
 r.inv.forEach(i=>rows.push([i.invoice_no,fd(i.created_at),i.customer_name,i.customer_phone,i.subtotal,i.discount,i.delivery,i.gst_amount,i.total,i.status]));
 rows.push([],['Product-wise','Qty','Amount']);r.pw.forEach(([k,v])=>rows.push([k,v.qty,v.amt]));
 rows.push([],['Customer-wise','Bills','Amount']);r.cw.forEach(([p,v])=>rows.push([v.name+' ('+p+')',v.n,v.amt]));
 download(new Blob(['\ufeff'+rows.map(r=>r.map(csvEsc).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),'kpr-sales-report-'+dkey(new Date())+'.csv');
}
async function repPdf(btn){
 btn.disabled=true;
 try{const r=repData();const n=el(`<div class="doc" style="padding:0"><div class="hd"><div><h1>${esc(S.settings.business)}</h1><p>Sales Report • ${fd(r.from)} – ${fd(r.to)}</p></div></div><div class="bd">
 <p><b>Total bills:</b> ${r.inv.length} &nbsp; <b>Total sales:</b> ${inr(r.total)}</p><br><b>Product-wise</b><table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead><tbody>${r.pw.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.qty}</td><td class="r">${inr(v.amt)}</td></tr>`).join('')}</tbody></table><br><b>Customer-wise</b>
 <table><thead><tr><th>Customer</th><th class="c">Bills</th><th class="r">Amount</th></tr></thead><tbody>${r.cw.map(([p,v])=>`<tr><td>${esc(v.name)} (${esc(p)})</td><td class="c">${v.n}</td><td class="r">${inr(v.amt)}</td></tr>`).join('')}</tbody></table></div></div>`);
  download(await pagesToPdf([n]),'kpr-sales-report-'+dkey(new Date())+'.pdf')}catch(e){toast('PDF failed: '+e.message,1)}finally{btn.disabled=false}
}
/* ---- settings ---- */
function tabSet(){
 const s=S.settings;
 $('#apage').innerHTML=`<div class="panel"><h3>⚙ ${t('t_set')}</h3><form id="sform"><div class="two">
 <div class="field"><label>${t('s_biz')}</label><input id="s_b" value="${esc(s.business)}"></div><div class="field"><label>${t('s_wa')}</label><input id="s_w" value="${esc(s.whatsapp)}"></div>
 <div class="field"><label>${t('s_ph1')}</label><input id="s_p1" value="${esc(s.phone1)}"></div><div class="field"><label>${t('s_ph2')}</label><input id="s_p2" value="${esc(s.phone2)}"></div>
 <div class="field"><label>${t('s_gst')}</label><input id="s_g" type="number" step="0.5" value="${s.gst_percent}"></div><div class="field"><label>${t('s_del')}</label><input id="s_d" type="number" value="${s.delivery}"></div>
 <div class="field"><label>${t('s_gstin')}</label><input id="s_gi" value="${esc(s.gstin)}"></div><div class="field"><label>${t('s_addr')}</label><input id="s_a" value="${esc(s.address)}"></div><div class="field"><label>${t('s_upi')}</label><input id="s_u" value="${esc(s.upi_id||'')}" autocapitalize="off"></div></div>
 <div class="field"><label>${t('s_logo')}</label><div style="display:flex;gap:10px;align-items:center"><img id="s_lp" src="${esc(logoSrc())}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;background:#eee" onerror="this.style.opacity=.2"><input type="file" id="s_l" accept="image/*"></div></div>
 <button class="btn" type="submit">💾 ${t('save')}</button></form></div>
 <div class="panel"><h3>🔑 ${t('s_pw')}</h3><div class="field"><input id="npw" type="password" placeholder="${t('s_newpw')}" autocomplete="new-password"></div><button class="btn sm" data-act="chPw">${t('save')}</button></div>
 <div class="panel"><button class="btn ghost" data-act="backup">💾 ${t('s_backup')}</button></div>`;
 let logo=s.logo;
 $('#s_l').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const b=await resizeImage(f,400,'image/png');logo=await blobToDataUrl(b);$('#s_lp').src=logo;$('#s_lp').style.opacity=1}catch(er){toast(er.message,1)}};
 $('#sform').onsubmit=async e=>{e.preventDefault();const ns={business:$('#s_b').value.trim()||'KPR Pickles',whatsapp:$('#s_w').value.trim(),phone1:$('#s_p1').value.trim(),phone2:$('#s_p2').value.trim(),gst_percent:num($('#s_g').value),delivery:num($('#s_d').value),gstin:$('#s_gi').value.trim(),address:$('#s_a').value.trim(),upi_id:$('#s_u').value.trim(),logo};
  try{await DB.saveSettings(ns);S.settings=ns;bill=newBill();toast(t('saved'));drawAdmin()}catch(er){toast('Save failed: '+er.message,1)}};
}

/* ================= events ================= */
document.addEventListener('click',async e=>{
 const lg=e.target.closest('[data-lang]');if(lg){lang=lg.dataset.lang;LS.set('lang',lang);if(location.hash.startsWith('#/admin')&&S.user)drawAdmin();else route();return}
 const sT=e.target.closest('[data-shop-type]');if(sT){shop={type:sT.dataset.shopType,cat:null};renderGrid();scrollShop();return}
 const sC=e.target.closest('[data-shop-cat]');if(sC){shop.cat=sC.dataset.shopCat;renderGrid();scrollShop();return}
 if(e.target.closest('[data-shop-back]')){if(shop.cat)shop.cat=null;else shop.type=null;renderGrid();scrollShop();return}
 const tab=e.target.closest('[data-tab]');if(tab){adminTab=tab.dataset.tab;drawTab();return}
 const go=e.target.closest('[data-go]');if(go){adminTab=go.dataset.go;drawTab();window.scrollTo(0,0);return}
 const sz=e.target.closest('.sz');if(sz){$$('.sz',sz.parentElement).forEach(b=>b.classList.remove('on'));sz.classList.add('on');return}
 const q=e.target.closest('[data-q]');if(q){const s=q.parentElement.querySelector('span');s.textContent=Math.max(1,Math.min(99,+s.textContent+ +q.dataset.q));return}
 const ci=e.target.closest('[data-ci]');if(ci){const i=+ci.dataset.ci;cart[i].qty+=+ci.dataset.d;if(cart[i].qty<1)cart.splice(i,1);saveCart();openCart();return}
 if(e.target.id==='ov'){closeCart();return}
 const a=e.target.closest('[data-act]');if(!a)return;
 const act=a.dataset.act,id=a.dataset.id;
 try{switch(act){
  case'closeModal':closeModal();break;
  case'openCart':openCart();break;
  case'closeCart':closeCart();break;
  case'addCart':{const card=a.closest('.card'),p=S.products.find(x=>x.id===card.dataset.id),s=p.sizes[+card.querySelector('.sz.on').dataset.i],qty=+card.querySelector('.qty span').textContent;
   const ex=cart.find(c=>c.pid===p.id&&c.g===s.g);if(ex)ex.qty+=qty;else cart.push({pid:p.id,name_en:p.name_en,name_te:p.name_te||'',g:s.g,price:s.price,qty});saveCart();toast('✓ '+t('added'));break}
  case'placeOrder':await placeOrder();break;
  case'orderPdf':await orderPdf();break;
  case'dlPdf':download(window.__pdf.blob,window.__pdf.name);break;
  case'sendWa':{const w=window.__pdf,no=normPhone($('#waNo').value),st=$('#waStat');st.style.display='block';
   if(!no){st.textContent='⚠ Enter a valid WhatsApp number.';break}
   const r=await sharePdfFile(w.blob,w.name,w.msg);
   if(r==='shared')st.textContent='Share sheet completed – choose the customer\'s chat ('+no+') in WhatsApp. Delivery status cannot be confirmed from the browser.';
   else if(r==='cancelled')st.textContent='Sharing cancelled – nothing was sent.';
   else{download(w.blob,w.name);window.open(waLink(no,w.msg),'_blank');st.textContent='WhatsApp opened for '+no+' with the message. The PDF was downloaded – attach it in the chat and press Send. Delivery is not confirmed automatically.'}break}
  case'copyUpi':{try{await navigator.clipboard.writeText(S.settings.upi_id);toast('✓ UPI ID copied')}catch{toast(S.settings.upi_id)}break}
  case'upiDone':await finalizeOrder(($('#uref').value||'').trim());break;
  case'orderPaid':await DB.updateOrder(id,{payment_status:'paid'});S.orders=await DB.orders();drawAdmin();break;
  case'sendMail':{const w=window.__pdf,em=$('#mailTo').value.trim(),st=$('#waStat');st.style.display='block';
   if(!/^\S+@\S+\.\S+$/.test(em)){st.textContent='⚠ Enter a valid email address.';break}
   download(w.blob,w.name);
   const subj=S.settings.business+' – Bill '+(w.inv?w.inv.invoice_no:'');
   st.textContent='Your email app is opening. The PDF was downloaded – attach it and press Send. Delivery is not confirmed automatically.';
   setTimeout(()=>{location.href='mailto:'+encodeURIComponent(em)+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(w.msg)},400);break}
  case'sendSms':{const w=window.__pdf,no=normPhone($('#waNo').value),st=$('#waStat');st.style.display='block';
   if(!no){st.textContent='⚠ Enter a valid mobile number.';break}
   const i=w.inv||{};
   const txt='Dear '+(i.customer_name||'Customer')+', your '+S.settings.business+' bill '+(i.invoice_no||'')+': Total '+inr(i.total)+' ('+(i.status==='paid'?'PAID':'UNPAID')+'). Thank you! Call '+S.settings.phone1;
   st.textContent='SMS app opening with a text summary (SMS cannot carry the PDF – use WhatsApp or email for the PDF). Press Send in the SMS app.';
   setTimeout(()=>{location.href='sms:+'+no+'?body='+encodeURIComponent(txt)},400);break}
  case'login':await doLogin();break;
  case'logout':await DB.logout();S.user=null;location.hash='#/admin';renderAdmin();break;
  case'addProduct':productForm();break;
  case'editProduct':productForm(S.products.find(x=>x.id===id));break;
  case'toggleActive':{const p=S.products.find(x=>x.id===id);await DB.saveProduct({id,active:p.active===false});S.products=await DB.products();drawTab();break}
  case'delProduct':if(confirm(t('confirm_del'))){await DB.deleteProduct(id);S.products=await DB.products();toast(t('saved'));drawTab()}break;
  case'addSize':editSizes.push({g:'',price:''});drawSizes();break;
  case'rmSize':editSizes.splice(+a.dataset.i,1);drawSizes();break;
  case'addLine':{const p=S.products.find(x=>x.id===id),s=p.sizes[+a.dataset.i];const ex=bill.lines.find(l=>l.pid===p.id&&l.g===s.g);if(ex)ex.qty++;else bill.lines.push({pid:p.id,name_en:p.name_en,name_te:p.name_te||'',g:s.g,price:s.price,qty:1,img:p.image_url||''});drawLines();break}
  case'lq':{const i=+a.dataset.i;bill.lines[i].qty+=+a.dataset.d;if(bill.lines[i].qty<1)bill.lines.splice(i,1);drawLines();break}
  case'lrm':bill.lines.splice(+a.dataset.i,1);drawLines();break;
  case'genBill':await genBill(a);break;
  case'invPdf':{a.disabled=true;try{const inv=S.invoices.find(x=>x.id===id);const blob=await invoicePdf(inv,inv.lang);pdfModal(blob,inv.invoice_no+'.pdf',{title:inv.invoice_no,phone:inv.customer_phone,msg:tl('wa_msg',inv.lang||'en'),inv})}finally{a.disabled=false}break}
  case'orderToBill':{const o=S.orders.find(x=>x.id===id);bill=newBill();bill.name=o.customer_name;bill.phone=o.customer_phone;bill.address=o.customer_address||'';bill.email=o.customer_email||'';bill.status=o.payment_status==='paid'?'paid':'unpaid';bill.pay=o.payment_method==='upi'?'UPI':(o.payment_method==='cod'?'Cash on Delivery':'');
   bill.lines=(o.items||[]).map(i=>{const p=S.products.find(x=>x.id===i.pid);return{pid:i.pid,name_en:i.name_en,name_te:i.name_te||'',g:i.g,price:i.price,qty:i.qty,img:p?p.image_url||'':''}});
   await DB.updateOrder(id,{status:'billed'});S.orders=await DB.orders();adminTab='bill';drawAdmin();break}
  case'orderDone':await DB.updateOrder(id,{status:'billed'});S.orders=await DB.orders();drawAdmin();break;
  case'delOrder':if(confirm(t('confirm_del'))){await DB.deleteOrder(id);S.orders=await DB.orders();drawAdmin()}break;
  case'custHist':{const p=a.dataset.p;const list=S.invoices.filter(i=>i.customer_phone===p);openModal(`<h3>${t('history')} – ${esc(p)}</h3>${invTable(list)}`);break}
  case'repCsv':repCsv();break;
  case'repPdf':await repPdf(a);break;
  case'chPw':{const pw=$('#npw').value;if(pw.length<8){toast('Min 8 characters',1);break}await DB.changePw(pw);$('#npw').value='';toast(t('saved'));break}
  case'backup':download(new Blob([JSON.stringify({exported:new Date().toISOString(),products:S.products,invoices:S.invoices,customers:S.customers,orders:S.orders,settings:{...S.settings,logo:''}},null,1)],{type:'application/json'}),'kpr-backup-'+dkey(new Date())+'.json');break;
 }}catch(err){console.error(err);toast('Error: '+(err.message||err),1)}
});
document.addEventListener('input',e=>{const i=e.target.dataset&&e.target.dataset.si;if(i!==undefined&&i!==''){editSizes[+i][e.target.dataset.k]=e.target.value}});

document.addEventListener('change',e=>{if(e.target.name==='pm'){payM=e.target.value;LS.set('pm',payM);$$('.payopt').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked))}});

/* ================= start ================= */
(async()=>{
 $('#app').innerHTML='<div style="padding:80px;text-align:center;color:#134020;font-weight:600">KPR Pickles…</div>';
 await loadPublic();bill=newBill();route();
})();
})();
</script>
